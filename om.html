<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operation & Maintenance (O&M) Services - Chaudhary Brothers Global Pvt. Limited</title>
  <link rel="stylesheet" href="cbgpl.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    /* 1. Hero Section Container */
    .rdi-hero {
      position: relative;
      height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      color: #fff;
    }

    /* 2. Smooth Background Slideshow for 6 Images */
    .rdi-hero::before,
    .rdi-hero::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
    }

    .rdi-hero::before {
      background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ser3.avif');
      animation: fadeImg1 30s infinite;
    }

    .rdi-hero::after {
      background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ser4.avif');
      animation: fadeImg2 30s infinite;
    }

    .om-bg-3 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ser1.avif');
      animation: fadeImg3 30s infinite;
    }

    .om-bg-4 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ser2.avif');
      animation: fadeImg4 30s infinite;
    }

    .om-bg-5 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ser5.avif');
      animation: fadeImg5 30s infinite;
    }

    .om-bg-6 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ser6.avif');
      animation: fadeImg6 30s infinite;
    }

    @keyframes fadeImg1 {
      0%   { opacity: 1; }
      13%  { opacity: 1; }
      16%  { opacity: 0; }
      97%  { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes fadeImg2 {
      0%   { opacity: 0; }
      13%  { opacity: 0; }
      16%  { opacity: 1; }
      30%  { opacity: 1; }
      33%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes fadeImg3 {
      0%   { opacity: 0; }
      30%  { opacity: 0; }
      33%  { opacity: 1; }
      47%  { opacity: 1; }
      50%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes fadeImg4 {
      0%   { opacity: 0; }
      47%  { opacity: 0; }
      50%  { opacity: 1; }
      64%  { opacity: 1; }
      67%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes fadeImg5 {
      0%   { opacity: 0; }
      64%  { opacity: 0; }
      67%  { opacity: 1; }
      81%  { opacity: 1; }
      84%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes fadeImg6 {
      0%   { opacity: 0; }
      81%  { opacity: 0; }
      84%  { opacity: 1; }
      97%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <i class="fa-solid fa-building"></i>
    <span>Chaudhary Brothers Global</span>
  </div>
  <nav>
    <ul>
      <li><a href="index.html#home">Home</a></li>
      <li><a href="index.html#services">Back to Services</a></li>
    </ul>
  </nav>
</header>

<section class="rdi-hero">
  <div class="om-bg-3"></div>
  <div class="om-bg-4"></div>
  <div class="om-bg-5"></div>
  <div class="om-bg-6"></div>
  <div class="hero-content">
    <h1>Operation & Maintenance (O&M) Services</h1>
    <p>Comprehensive O&M support for projects.</p>
    <div style="margin-top: 25px;"><a href="index.html#contact" class="btn">Enquire Now</a></div>
  </div>
</section>

</body>
</html>
