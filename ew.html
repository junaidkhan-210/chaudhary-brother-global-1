<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Electrical Installation & Electrification Works - Chaudhary Brothers Global Pvt. Limited</title>
  <link rel="stylesheet" href="cbgpl.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Background Image Slider for all 5 images */
    .eiw-hero {
      position: relative;
      height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      animation: eiwSlider 25s infinite ease-in-out;
    }

    @keyframes eiwSlider {
      0%    { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('e1.webp'); }
      20%   { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('e2.avif'); }
      40%   { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('e3.avif'); }
      60%   { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('e4.avif'); }
      80%   { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('e5.avif'); }
      100%  { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('e1.webp'); }
    }
  </style>
</head>

  </div>

    </ul>
  </nav>

<section class="eiw-hero">
  <div class="overlay"></div>
  <div class="hero-content">
    <h1>Electrical Installation & Electrification Works</h1>
    <p>Delivering modern, durable, and high-quality commercial spaces.</p>
    <div style="margin-top: 25px;"><a href="index.html#contact" class="btn">Enquire Now</a></div>
  </div>
</section>

</body>
</html>
