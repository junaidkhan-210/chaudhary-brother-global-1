<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Management & Consultancy - Chaudhary Brothers Global Pvt. Limited</title>
  <link rel="stylesheet" href="cbgpl.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    /* 1. Hero Section Container */
    .rdi-hero {
      position: relative;
      height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      color: #fff;
    }

    /* 2. Smooth Background Slideshow for 4 Images */
    .rdi-hero::before,
    .rdi-hero::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
    }

    .rdi-hero::before {
      background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('p1.avif');
      animation: fadeImg1 20s infinite;
    }

    .rdi-hero::after {
      background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('p2.avif');
      animation: fadeImg2 20s infinite;
    }

    .pm-bg-3 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('p3.avif');
      animation: fadeImg3 20s infinite;
    }

    .pm-bg-4 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('p4.avif');
      animation: fadeImg4 20s infinite;
    }

    @keyframes fadeImg1 {
      0%   { opacity: 1; }
      20%  { opacity: 1; }
      25%  { opacity: 0; }
      95%  { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes fadeImg2 {
      0%   { opacity: 0; }
      20%  { opacity: 0; }
      25%  { opacity: 1; }
      45%  { opacity: 1; }
      50%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes fadeImg3 {
      0%   { opacity: 0; }
      45%  { opacity: 0; }
      50%  { opacity: 1; }
      70%  { opacity: 1; }
      75%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes fadeImg4 {
      0%   { opacity: 0; }
      70%  { opacity: 0; }
      75%  { opacity: 1; }
      95%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <i class="fa-solid fa-building"></i>
    <span>Chaudhary Brothers Global</span>
  </div>
  <nav>
    <ul>
      <li><a href="index.html#home">Home</a></li>
      <li><a href="index.html#services">Back to Services</a></li>
    </ul>
  </nav>
</header>

<section class="rdi-hero">
  <div class="pm-bg-3"></div>
  <div class="pm-bg-4"></div>
  <div class="hero-content">
    <h1>Project Management & Consultancy</h1>
    <p>Delivering modern, durable, and high-quality commercial spaces.</p>
    <div style="margin-top: 25px;"><a href="index.html#contact" class="btn">Enquire Now</a></div>
  </div>
</section>

</body>
</html>
