<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Government Contracting & Tender Execution - Chaudhary Brothers Global Pvt. Limited</title>
  <link rel="stylesheet" href="cbgpl.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Background Image Slider for all 5 images */
    .govt-hero {
      position: relative;
      height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      animation: govtSlider 25s infinite ease-in-out;
    }

    @keyframes govtSlider {
      0%    { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('govt1.jpeg'); }
      20%   { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('govt2.jpeg'); }
      40%   { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('govt3.jpeg'); }
      60%   { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('govt4.jpeg'); }
      80%   { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('govt5.jpeg'); }
      100%  { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('govt1.jpeg'); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <i class="fa-solid fa-building"></i>
    <span>Chaudhary Brothers Global</span>
  </div>
  <nav>

      <li><a href="index.html#home">Home</a></li>
      <li><a href="index.html#services">Back to Services</a></li>
    </ul>
  </nav>
</header>

<section class="govt-hero">
  <div class="overlay"></div>
  <div class="hero-content">
    <h1>Government Contracting & Tender Execution</h1>
    <p>Delivering modern, durable, and high-quality commercial spaces.</p>
    <div style="margin-top: 25px;"><a href="index.html#contact" class="btn">Enquire Now</a></div>
  </div>
</section>

</body>
</html>
