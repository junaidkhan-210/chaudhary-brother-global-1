  <style>
    /* Background Image Slider for all 6 images */
    .acc-hero {
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      animation: heroImageSlider 24s infinite ease-in-out;
    }

    @keyframes heroImageSlider {
      0%   { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ag1.avif'); }
      16.6% { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ag2.avif'); }
      33.3% { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ag3.avif'); }
      50%   { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ag4.avif'); }
      66.6% { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ag5.avif'); }
      83.3% { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ag6.avif'); }
      100%  { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('ag1.avif'); }
    }
  </style>
</head>
